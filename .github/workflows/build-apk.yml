name: Construir APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        run: |
          test -f proyecto-apk.zip || { echo "Falta proyecto-apk.zip en la raiz del repositorio"; exit 1; }
          rm -rf build-src && mkdir build-src
          unzip -q proyecto-apk.zip -d build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK
        working-directory: build-src
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Preparar APK
        run: cp build-src/app/build/outputs/apk/release/app-release.apk NeuroAudio.apk

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NeuroAudio-apk
          path: NeuroAudio.apk

      - name: Publicar descarga directa (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Neuro-Audio v${{ github.run_number }}
          files: NeuroAudio.apk
