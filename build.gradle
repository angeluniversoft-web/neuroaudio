plugins {
    id 'com.android.application'
}

android {
    namespace 'com.angel.neuroaudio'
    compileSdk 34

    defaultConfig {
        applicationId "com.angel.neuroaudio"
        minSdk 27
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    signingConfigs {
        fixed {
            storeFile file('neuroaudio.keystore')
            storePassword 'neuroaudio'
            keyAlias 'neuroaudio'
            keyPassword 'neuroaudio'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fixed }
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    androidResources {
        noCompress 'flac'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.webkit:webkit:1.11.0'
}
